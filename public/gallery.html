<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototypes</title>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1c;
      --line: rgba(255,255,255,.08);
      --text: #f2f2f3;
      --muted: #8e8e93;
      --accent: #0d99ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

    header { max-width: 1440px; margin: 0 auto; padding: 48px 40px 8px; display: flex; align-items: baseline; gap: 14px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
    .count { color: var(--muted); font-size: 15px; }

    main { max-width: 1440px; margin: 0 auto; padding: 24px 40px 120px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }

    .card {
      display: block; color: inherit; text-decoration: none; outline: none;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .cover { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
    .cover .placeholder {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
      background: radial-gradient(120% 90% at 30% 0%, #2a2a30 0%, #111 70%); color: var(--muted); font-size: 13px;
    }
    .play {
      position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center; transform: translate(-50%, -50%) scale(.9);
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(6px);
      opacity: 0; transition: opacity .18s ease, transform .18s ease;
    }
    .play svg { margin-left: 3px; }
    .meta { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 2px; }
    .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kind { color: var(--muted); font-size: 13px; }

    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: rgba(255,255,255,.18); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
    .card:hover img, .card:focus-visible img { transform: scale(1.03); }
    .card:hover .play, .card:focus-visible .play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .card:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 40px rgba(0,0,0,.45); }

    .keys {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: flex; gap: 18px; align-items: center; padding: 10px 18px; border-radius: 999px;
      background: rgba(26,26,28,.85); border: 1px solid var(--line); backdrop-filter: blur(10px);
      color: var(--muted); font-size: 13px; white-space: nowrap;
    }
    kbd {
      display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-right: 6px;
      border-radius: 5px; border: 1px solid rgba(255,255,255,.18); border-bottom-width: 2px;
      color: var(--text); font: 600 12px/1 Inter, system-ui, sans-serif;
    }
    .empty, .error { color: var(--muted); padding: 60px 0; text-align: center; }

    .player-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 10; }
    body.playing { overflow: hidden; }
    body.playing .keys { display: none; }

    @media (max-width: 720px) {
      header { padding: 32px 16px 4px; }
      main { padding: 16px 16px 100px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .keys { gap: 12px; font-size: 12px; }
      .keys .wide { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header><h1>Prototypes</h1><span class="count" id="count"></span></header>
  <main><div class="grid" id="grid"></div></main>
  <div class="keys">
    <span class="wide"><kbd>←</kbd><kbd>→</kbd>choose</span>
    <span><kbd>R</kbd>restart a prototype</span>
    <span><kbd>M</kbd>back to this menu</span>
    <span class="wide"><kbd>P</kbd><kbd>N</kbd>previous / next prototype</span>
  </div>
  <!--cp-offline-data-->
  <script>
    // Online: cards link to /p/<id>?menu. In the offline file (built by the
    // editor's "Download offline file"), prototypes, covers and videos are
    // embedded in this page: a card opens its prototype in a full-screen frame
    // over the gallery, and M (in the player) closes it again.
    const OFFLINE = document.getElementById('cp-gallery');
    const grid = document.getElementById('grid');
    const PLAY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const kind = p => (p.mode === 'timeline' ? 'Interactive video' : `${p.clips} screen${p.clips === 1 ? '' : 's'}`);

    const load = OFFLINE
      ? Promise.resolve(JSON.parse(OFFLINE.textContent))
      : fetch('/api/gallery').then(r => (r.ok ? r.json() : Promise.reject(new Error(r.status))));

    let order = []; // prototype ids in gallery order, for N / P in the player
    load.then(list => {
      order = list.map(p => p.id);
      try { sessionStorage.setItem('cp-gallery', JSON.stringify(order)); } catch {}
      document.getElementById('count').textContent = list.length ? `${list.length} prototype${list.length === 1 ? '' : 's'}` : '';
      if (!list.length) return grid.replaceWith(el('p', 'empty', 'No prototypes yet.'));
      for (const p of list) {
        const a = el('a', 'card');
        a.dataset.id = p.id;
        a.href = OFFLINE ? '#' : `/p/${encodeURIComponent(p.id)}?menu`;
        const cover = el('div', 'cover');
        if (p.cover) {
          const img = el('img');
          img.src = p.coverUrl || `/media/${p.cover}`;
          img.alt = '';
          img.loading = 'lazy';
          img.onerror = () => img.replaceWith(el('div', 'placeholder', p.name));
          cover.append(img);
        } else cover.append(el('div', 'placeholder', p.name));
        const play = el('div', 'play');
        play.innerHTML = PLAY;
        cover.append(play);
        const meta = el('div', 'meta');
        meta.append(el('div', 'name', p.name), el('div', 'kind', kind(p)));
        a.append(cover, meta);
        grid.append(a);
      }
      // Come back to the card you left from.
      const back = grid.querySelector(`.card[data-id="${CSS.escape(sessionStorageGet() || '')}"]`);
      (back || grid.firstElementChild)?.focus({ preventScroll: !back });
      grid.addEventListener('click', e => {
        const c = e.target.closest('.card');
        if (!c) return;
        sessionStorageSet(c.dataset.id);
        if (OFFLINE) { e.preventDefault(); openPrototype(c.dataset.id); }
      });
    }).catch(() => grid.replaceWith(el('p', 'error', "Couldn't load the prototypes. Refresh to try again.")));

    function sessionStorageGet() { try { return sessionStorage.getItem('cp-last'); } catch { return null; } }
    function sessionStorageSet(v) { try { sessionStorage.setItem('cp-last', v); } catch {} }

    // Arrow keys move between cards (row by row), Enter opens.
    addEventListener('keydown', e => {
      if (document.querySelector('.player-frame')) return;
      const cards = [...grid.querySelectorAll('.card')];
      if (!cards.length) return;
      const i = cards.indexOf(document.activeElement);
      const cols = Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length);
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
      if (step) {
        e.preventDefault();
        const next = i < 0 ? 0 : Math.min(cards.length - 1, Math.max(0, i + step));
        cards[next].focus();
        cards[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });

    // ---- offline file only: play a prototype in a frame over the gallery
    //
    // The player (embedded as text) runs in an iframe and asks this page for
    // each video by file name (window.cpGallery.media). Videos are decoded from
    // their embedded base64 once and kept as Blobs, so reopening is instant.
    const blobs = new Map(); // file -> Promise<Blob>
    const parsed = () => (document.readyState === 'loading' ? new Promise(r => addEventListener('DOMContentLoaded', r, { once: true })) : null);

    window.cpGallery = {
      media(file, onProgress = () => {}) {
        if (!blobs.has(file)) {
          blobs.set(file, (async () => {
            await parsed(); // the videos come after this script in the file
            const node = document.querySelector(`script[data-cp-media="${CSS.escape(file)}"]`);
            if (!node) throw new Error(`Missing embedded video ${file}`);
            const b64 = node.textContent.replace(/\s+/g, '');
            const type = node.dataset.type || 'video/mp4';
            node.remove(); // the Blob below is kept instead of the text
            const STEP = 4 * 1024 * 1024; // a multiple of 4 base64 characters
            const parts = [];
            for (let i = 0; i < b64.length; i += STEP) {
              const bin = atob(b64.slice(i, i + STEP));
              const bytes = new Uint8Array(bin.length);
              for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
              parts.push(bytes);
              onProgress(Math.min(i + STEP, b64.length) * 0.75);
              await new Promise(r => setTimeout(r, 0));
            }
            return new Blob(parts, { type });
          })());
        }
        return blobs.get(file);
      },
      close: closePrototype,
      // N / P in the player: the next or previous prototype, wrapping round.
      step(by) {
        const i = order.indexOf(openId);
        const next = order[((i < 0 ? (by > 0 ? -1 : 0) : i) + by + order.length) % order.length];
        if (next) { sessionStorageSet(next); openPrototype(next); }
      },
    };

    let openId = null;
    function openPrototype(id) {
      closePrototype();
      openId = id;
      sessionStorageSet(id);
      const proj = document.querySelector(`script[data-cp-proj="${CSS.escape(id)}"]`);
      const player = JSON.parse(document.getElementById('cp-player').textContent);
      const frame = el('iframe', 'player-frame');
      // "*": the embedded page has no origin of its own to name (opened from disk).
      frame.allow = 'fullscreen *; autoplay *';
      frame.srcdoc = player.head
        + `<script type="application/json" id="cp-project">${proj.textContent}<\/script>\n`
        + `<script type="module">\n${player.js}\n<\/script>` + player.tail;
      frame.addEventListener('load', () => frame.contentWindow.focus());
      document.body.append(frame);
      document.body.classList.add('playing');
    }

    function closePrototype() {
      const frame = document.querySelector('.player-frame');
      if (!frame) return;
      frame.remove(); // drops the prototype's video elements and decoders
      document.body.classList.remove('playing');
      grid.querySelector(`.card[data-id="${CSS.escape(sessionStorageGet() || '')}"]`)?.focus();
    }
  </script>
  <!--cp-offline-media-->
</body>
</html>
