<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototypes</title>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1c;
      --line: rgba(255,255,255,.08);
      --text: #f2f2f3;
      --muted: #8e8e93;
      --accent: #0d99ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

    header { max-width: 1440px; margin: 0 auto; padding: 48px 40px 8px; display: flex; align-items: baseline; gap: 14px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
    .count { color: var(--muted); font-size: 15px; }
    header .spacer { flex: 1; }

    /* Phone remote: header button + panel */
    .remote-btn {
      align-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); color: var(--text); font: 500 13px Inter, system-ui, sans-serif; cursor: pointer;
    }
    .remote-btn:hover { border-color: rgba(255,255,255,.2); }
    .remote-btn svg { width: 16px; height: 16px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot[data-s="waiting"] { background: #e8b04a; }
    .dot[data-s="linked"] { background: #3ddc84; }
    .dot[data-s="off"] { display: none; }
    .remote-panel {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
      background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    }
    .remote-card {
      width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; border-radius: 16px;
      background: #17171a; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .remote-card h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .remote-card .lede { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .pair-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    .qr { background: #fff; padding: 8px; border-radius: 8px; line-height: 0; width: 168px; flex: none; }
    .qr svg { width: 100%; height: auto; }
    .qr .qr-msg { color: #111; font-size: 12px; line-height: 1.4; }
    .pair-info { display: grid; gap: 8px; min-width: 0; flex: 1; font-size: 14px; color: var(--muted); }
    .pair-code { font: 500 20px ui-monospace, "JetBrains Mono", Consolas, monospace; letter-spacing: .08em; color: var(--text); }
    .pair-status { display: flex; align-items: center; gap: 8px; color: var(--text); }
    .remote-card table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
    .remote-card td { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .remote-card td:last-child { text-align: right; color: var(--muted); }
    .remote-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 18px; }
    .linkish { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font: 13px Inter, system-ui, sans-serif; }
    .linkish:hover { color: var(--text); }
    .remote-actions .close { margin-left: auto; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--text); color: #111; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; }
    .remote-warn { margin: 0 0 16px; padding: 10px 12px; border: 1px solid #ef6a5e; border-radius: 8px; font-size: 13px; }

    main { max-width: 1440px; margin: 0 auto; padding: 24px 40px 120px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }

    .card {
      display: block; color: inherit; text-decoration: none; outline: none;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .cover { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
    .cover .placeholder {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
      background: radial-gradient(120% 90% at 30% 0%, #2a2a30 0%, #111 70%); color: var(--muted); font-size: 13px;
    }
    .play {
      position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center; transform: translate(-50%, -50%) scale(.9);
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(6px);
      opacity: 0; transition: opacity .18s ease, transform .18s ease;
    }
    .play svg { margin-left: 3px; }
    .meta { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 2px; }
    .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kind { color: var(--muted); font-size: 13px; }

    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: rgba(255,255,255,.18); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
    .card:hover img, .card:focus-visible img { transform: scale(1.03); }
    .card:hover .play, .card:focus-visible .play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .card:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 40px rgba(0,0,0,.45); }

    .keys {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: flex; gap: 18px; align-items: center; padding: 10px 18px; border-radius: 999px;
      background: rgba(26,26,28,.85); border: 1px solid var(--line); backdrop-filter: blur(10px);
      color: var(--muted); font-size: 13px; white-space: nowrap;
    }
    kbd {
      display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-right: 6px;
      border-radius: 5px; border: 1px solid rgba(255,255,255,.18); border-bottom-width: 2px;
      color: var(--text); font: 600 12px/1 Inter, system-ui, sans-serif;
    }
    .empty, .error { color: var(--muted); padding: 60px 0; text-align: center; }

    .player-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 10; }
    body.playing { overflow: hidden; }
    body.playing .keys { display: none; }

    @media (max-width: 720px) {
      header { padding: 32px 16px 4px; }
      main { padding: 16px 16px 100px; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .keys { gap: 12px; font-size: 12px; }
      .keys .wide { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>Prototypes</h1><span class="count" id="count"></span><span class="spacer"></span>
    <button class="remote-btn" id="remoteBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="3"/><circle cx="12" cy="9" r="2.2"/><path d="M10 15h.01M14 15h.01M10 18h.01M14 18h.01"/></svg>
      Phone remote <i class="dot" id="remoteDot" data-s="off"></i>
    </button>
  </header>
  <main><div class="grid" id="grid"></div></main>
  <div class="keys">
    <span class="wide"><kbd>←</kbd><kbd>→</kbd>choose</span>
    <span><kbd>R</kbd>restart a prototype</span>
    <span><kbd>M</kbd>back to this menu</span>
    <span class="wide"><kbd>P</kbd><kbd>N</kbd>previous / next prototype</span>
  </div>
  <!--cp-offline-data-->
  <script src="/remote-link.js" data-cp-inline="remote-link.js"></script>
  <script>
    // Online: cards link to /p/<id>?menu. In the offline file (built by the
    // editor's "Download offline file"), prototypes, covers and videos are
    // embedded in this page: a card opens its prototype in a full-screen frame
    // over the gallery, and M (in the player) closes it again.
    const OFFLINE = document.getElementById('cp-gallery');
    const grid = document.getElementById('grid');
    const PLAY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const kind = p => (p.mode === 'timeline' ? 'Interactive video' : `${p.clips} screen${p.clips === 1 ? '' : 's'}`);

    const load = OFFLINE
      ? Promise.resolve(JSON.parse(OFFLINE.textContent))
      : fetch('/api/gallery').then(r => (r.ok ? r.json() : Promise.reject(new Error(r.status))));

    let order = []; // prototype ids in gallery order, for N / P in the player
    load.then(list => {
      order = list.map(p => p.id);
      try { sessionStorage.setItem('cp-gallery', JSON.stringify(order)); } catch {}
      document.getElementById('count').textContent = list.length ? `${list.length} prototype${list.length === 1 ? '' : 's'}` : '';
      if (!list.length) return grid.replaceWith(el('p', 'empty', 'No prototypes yet.'));
      for (const p of list) {
        const a = el('a', 'card');
        a.dataset.id = p.id;
        a.href = OFFLINE ? '#' : `/p/${encodeURIComponent(p.id)}?menu`;
        const cover = el('div', 'cover');
        if (p.cover) {
          const img = el('img');
          img.src = p.coverUrl || `/media/${p.cover}`;
          img.alt = '';
          img.loading = 'lazy';
          img.onerror = () => img.replaceWith(el('div', 'placeholder', p.name));
          cover.append(img);
        } else cover.append(el('div', 'placeholder', p.name));
        const play = el('div', 'play');
        play.innerHTML = PLAY;
        cover.append(play);
        const meta = el('div', 'meta');
        meta.append(el('div', 'name', p.name), el('div', 'kind', kind(p)));
        a.append(cover, meta);
        grid.append(a);
      }
      // Come back to the card you left from.
      const back = grid.querySelector(`.card[data-id="${CSS.escape(sessionStorageGet() || '')}"]`);
      (back || grid.firstElementChild)?.focus({ preventScroll: !back });
      grid.addEventListener('click', e => {
        const c = e.target.closest('.card');
        if (!c) return;
        sessionStorageSet(c.dataset.id);
        if (OFFLINE) { e.preventDefault(); openPrototype(c.dataset.id); }
      });
    }).catch(() => grid.replaceWith(el('p', 'error', "Couldn't load the prototypes. Refresh to try again.")));

    function sessionStorageGet() { try { return sessionStorage.getItem('cp-last'); } catch { return null; } }
    function sessionStorageSet(v) { try { sessionStorage.setItem('cp-last', v); } catch {} }

    // Arrow keys move between cards (row by row), Enter opens.
    addEventListener('keydown', e => {
      if (document.querySelector('.player-frame')) return;
      const cards = [...grid.querySelectorAll('.card')];
      if (!cards.length) return;
      const i = cards.indexOf(document.activeElement);
      const cols = Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length);
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
      if (step) {
        e.preventDefault();
        const next = i < 0 ? 0 : Math.min(cards.length - 1, Math.max(0, i + step));
        cards[next].focus();
        cards[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });

    // ---- offline file only: play a prototype in a frame over the gallery
    //
    // The player (embedded as text) runs in an iframe and asks this page for
    // each video by file name (window.cpGallery.media). Videos are decoded from
    // their embedded base64 once and kept as Blobs, so reopening is instant.
    const blobs = new Map(); // file -> Promise<Blob>
    const parsed = () => (document.readyState === 'loading' ? new Promise(r => addEventListener('DOMContentLoaded', r, { once: true })) : null);

    window.cpGallery = {
      media(file, onProgress = () => {}) {
        if (!blobs.has(file)) {
          blobs.set(file, (async () => {
            await parsed(); // the videos come after this script in the file
            const node = document.querySelector(`script[data-cp-media="${CSS.escape(file)}"]`);
            if (!node) throw new Error(`Missing embedded video ${file}`);
            const b64 = node.textContent.replace(/\s+/g, '');
            const type = node.dataset.type || 'video/mp4';
            node.remove(); // the Blob below is kept instead of the text
            const STEP = 4 * 1024 * 1024; // a multiple of 4 base64 characters
            const parts = [];
            for (let i = 0; i < b64.length; i += STEP) {
              const bin = atob(b64.slice(i, i + STEP));
              const bytes = new Uint8Array(bin.length);
              for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
              parts.push(bytes);
              onProgress(Math.min(i + STEP, b64.length) * 0.75);
              await new Promise(r => setTimeout(r, 0));
            }
            return new Blob(parts, { type });
          })());
        }
        return blobs.get(file);
      },
      close: closePrototype,
      // N / P in the player: the next or previous prototype, wrapping round.
      step(by) {
        const i = order.indexOf(openId);
        const next = order[((i < 0 ? (by > 0 ? -1 : 0) : i) + by + order.length) % order.length];
        if (next) { sessionStorageSet(next); openPrototype(next); }
      },
    };

    let openId = null;
    function openPrototype(id) {
      closePrototype();
      openId = id;
      sessionStorageSet(id);
      const proj = document.querySelector(`script[data-cp-proj="${CSS.escape(id)}"]`);
      const player = JSON.parse(document.getElementById('cp-player').textContent);
      const frame = el('iframe', 'player-frame');
      // "*": the embedded page has no origin of its own to name (opened from disk).
      frame.allow = 'fullscreen *; autoplay *';
      frame.srcdoc = player.head
        + `<script type="application/json" id="cp-project">${proj.textContent}<\/script>\n`
        + `<script type="module">\n${player.js}\n<\/script>` + player.tail;
      frame.addEventListener('load', () => frame.contentWindow.focus());
      document.body.append(frame);
      document.body.classList.add('playing');
    }

    function closePrototype() {
      const frame = document.querySelector('.player-frame');
      if (!frame) return;
      frame.remove(); // drops the prototype's video elements and decoders
      document.body.classList.remove('playing');
      grid.querySelector(`.card[data-id="${CSS.escape(sessionStorageGet() || '')}"]`)?.focus();
    }

    // ---- phone remote (remote-link.js)
    //
    // "Phone remote" pairs this browser with a phone: the panel shows a QR code
    // for /remote#<code>. The gallery then follows the phone (arrows choose, OK
    // opens), and every prototype opened in this browser connects on its own.
    // In the offline file, keys for an open prototype are passed into its frame.
    const R = window.ClipRemote;
    const dot = document.getElementById('remoteDot');
    // This side only knows the phone is there once a button arrives, so:
    // connecting (relay not reached) → ready (reached) → linked (a press came in).
    let link = null, linkState = 'off', heardPhone = false;
    const setState = s => { linkState = s; dot.dataset.s = s === 'linked' ? 'linked' : s === 'off' ? 'off' : 'waiting'; const st = document.querySelector('.pair-status'); if (st) paintStatus(st); };
    const paintStatus = node => { const d = el('i', 'dot'); d.dataset.s = dot.dataset.s; node.replaceChildren(d, statusText()); };
    const statusText = () => ({ off: 'Off', connecting: 'Connecting…', ready: 'Ready: press any button on the phone', linked: 'Phone linked' }[linkState]);

    function startLink() {
      link?.stop();
      heardPhone = false;
      setState('connecting');
      link = R.listen({
        onState: s => setState(s !== 'up' ? 'connecting' : heardPhone ? 'linked' : 'ready'),
        onKey: (k, name) => {
          if (!heardPhone) { heardPhone = true; setState('linked'); }
          closePanel();
          const frame = document.querySelector('.player-frame');
          if (frame) return R.press(k, frame.contentWindow); // offline file: the open prototype
          if (name === 'OK') {
            const card = document.activeElement?.closest?.('.card') || grid.querySelector('.card');
            card?.focus(); card?.click();
          } else if (/^(UP|DOWN|LEFT|RIGHT)$/.test(name)) R.press(k);
        },
      });
    }

    let qrLib = null;
    const loadQr = () => (qrLib ||= new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      s.onload = () => res(window.qrcode); s.onerror = rej;
      document.head.append(s);
    }));

    let focusBefore = null;
    function openPanel() {
      closePanel();
      focusBefore = document.activeElement?.closest?.('.card') || null;
      const id = R.id() || R.newId();
      if (!link) startLink();
      const url = R.remoteUrl(id);
      const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || (location.protocol === 'file:' && !window.CLIP_PROTO_ORIGIN);
      const panel = el('div', 'remote-panel');
      panel.setAttribute('role', 'dialog');
      panel.setAttribute('aria-label', 'Phone remote');
      const qr = el('div', 'qr');
      const status = el('div', 'pair-status'); paintStatus(status);
      const keys = [['D-pad', 'Move (arrow keys)'], ['OK', 'Open / select (Enter)'], ['Back', 'Back (Backspace)'], ['Home', 'Restart the prototype (R)'], ['Main Menu', 'Back to this gallery (M)'], ['Help', 'Show the help (H)'], ['Voice', 'Voice assistant (V)'], ['Prev / Next Proto', 'Previous / next prototype (P / N)']];
      const table = el('table'); const tb = el('tbody');
      for (const [a, b] of keys) { const tr = el('tr'); tr.append(el('td', '', a), el('td', '', b)); tb.append(tr); }
      table.append(tb);
      const card = el('div', 'remote-card');
      const actions = el('div', 'remote-actions');
      const newCode = el('button', 'linkish', 'New code');
      const turnOff = el('button', 'linkish', 'Turn off');
      const openHere = el('a', 'linkish', 'Open the remote here'); openHere.href = url; openHere.target = '_blank'; openHere.rel = 'noopener';
      const done = el('button', 'close', 'Done');
      newCode.onclick = () => { R.newId(); startLink(); openPanel(); };
      turnOff.onclick = () => { link?.stop(); link = null; R.off(); setState('off'); closePanel(); };
      done.onclick = closePanel;
      actions.append(newCode, turnOff, openHere, done);
      const info = el('div', 'pair-info');
      info.append(el('div', '', 'Scan with your phone’s camera. Pairing code:'), el('div', 'pair-code', id.replace(/(.{4})/g, '$1 ').trim()), status,
        el('div', '', 'Tip: Add to Home Screen on the phone for a full-screen remote.'));
      const row = el('div', 'pair-row'); row.append(qr, info);
      card.append(...[el('h2', '', 'Phone remote'),
        el('p', 'lede', 'Use your phone as a TV remote. The gallery and every prototype you open in this browser follow it.'),
        local && el('p', 'remote-warn', 'This page is on localhost, which the phone can’t reach. Use the hosted gallery for the remote.'),
        row, table, actions].filter(Boolean));
      panel.append(card);
      panel.addEventListener('click', e => { if (e.target === panel) closePanel(); });
      document.body.append(panel);
      done.focus();
      loadQr().then(lib => {
        const q = lib(0, 'M'); q.addData(url); q.make();
        qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      }).catch(() => { qr.replaceChildren(el('div', 'qr-msg', `Couldn’t make the QR code. On the phone, open ${url}`)); });
    }

    function closePanel() {
      const panel = document.querySelector('.remote-panel');
      if (!panel) return;
      panel.remove();
      (focusBefore || grid.querySelector('.card'))?.focus(); // back to where you were
    }

    document.getElementById('remoteBtn').onclick = openPanel;
    addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
    if (R?.id()) startLink(); // already paired in this browser
  </script>
  <!--cp-offline-media-->
</body>
</html>
